<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" width="1280" height="830" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">Cwtch &amp; Cake architecture on AWS</title>
  <desc id="d">Students and the café admin use the site through CloudFront. CloudFront serves pages from a private S3 bucket and sends /api/* to API Gateway, which runs eight Lambda functions that read and write four DynamoDB tables. The admin signs in with Cognito and MFA. EventBridge Scheduler runs a daily reset. CloudWatch collects logs and metrics, and two alarms email through SNS. SES emails and the Comprehend toxicity check are built but switched off. GitHub Actions deploys through an IAM role using OIDC, and Terraform builds everything, keeping its state in a versioned S3 bucket.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a5a2c"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b39a85"/>
    </marker>
    <style>
      .bg { fill: #fbf5ec; }
      .box { fill: #fffdf9; stroke: #e6d3bd; stroke-width: 1.5; }
      .off { fill: #fbf5ec; stroke: #c9b29b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .name { font-size: 15.5px; font-weight: 700; fill: #3b2416; }
      .sub { font-size: 12.5px; fill: #7a5a45; }
      .lbl { font-size: 12px; font-weight: 600; fill: #9a5a2c; }
      .lblm { font-size: 12px; fill: #8c735f; }
      .line { fill: none; stroke: #9a5a2c; stroke-width: 1.8; }
      .linem { fill: none; stroke: #b39a85; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .region { fill: none; stroke: #d8bfa4; stroke-width: 1.5; stroke-dasharray: 3 5; }
      .h1 { font-size: 22px; font-weight: 750; fill: #3b2416; }
      .h2 { font-size: 13px; fill: #7a5a45; }
      .tag { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; fill: #9a5a2c; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="830" rx="20"/>

  <!-- Title + legend -->
  <text class="h1" x="40" y="48">How Cwtch &amp; Cake is built</text>
  <text class="h2" x="40" y="70">Serverless on AWS, built with Terraform, deployed by GitHub Actions</text>
  <g transform="translate(905 40)">
    <line class="line" x1="0" y1="6" x2="34" y2="6" marker-end="url(#a)"/>
    <text class="lblm" x="44" y="10">request or data</text>
    <rect class="off" x="160" y="-4" width="34" height="20" rx="5"/>
    <text class="lblm" x="204" y="10">built, switched off</text>
  </g>

  <!-- AWS region boundary -->
  <rect class="region" x="470" y="100" width="780" height="700" rx="18"/>
  <rect class="bg" x="488" y="91" width="205" height="18"/>
  <text class="tag" x="496" y="105">AWS · LONDON (EU-WEST-2)</text>

  <!-- People -->
  <g>
    <rect class="box" x="40" y="148" width="160" height="68" rx="12"/>
    <rect x="52" y="162" width="4" height="40" rx="2" fill="#3b2416"/>
    <text class="name" x="66" y="177">Students</text>
    <text class="sub" x="66" y="197">browser or phone</text>
  </g>
  <g>
    <rect class="box" x="40" y="430" width="160" height="68" rx="12"/>
    <rect x="52" y="444" width="4" height="40" rx="2" fill="#3b2416"/>
    <text class="name" x="66" y="459">Café admin</text>
    <text class="sub" x="66" y="479">sign-in + MFA app</text>
  </g>

  <!-- CloudFront (global edge) -->
  <g>
    <rect class="box" x="250" y="120" width="190" height="200" rx="12"/>
    <rect x="262" y="134" width="4" height="172" rx="2" fill="#8c4fff"/>
    <text class="name" x="276" y="150">CloudFront</text>
    <text class="sub" x="276" y="172">global edge, HTTPS only</text>
    <text class="sub" x="276" y="192">strict security headers</text>
    <text class="sub" x="276" y="212">caches pages + API</text>
    <text class="sub" x="276" y="232">pretty URLs (Function)</text>
    <text class="sub" x="276" y="252">adds a secret header</text>
    <text class="sub" x="276" y="270">to API requests</text>
  </g>

  <!-- S3 website -->
  <g>
    <rect class="box" x="510" y="128" width="200" height="68" rx="12"/>
    <rect x="522" y="142" width="4" height="40" rx="2" fill="#7aa116"/>
    <text class="name" x="536" y="157">S3 website bucket</text>
    <text class="sub" x="536" y="177">private, CloudFront only</text>
  </g>

  <!-- API Gateway -->
  <g>
    <rect class="box" x="510" y="238" width="200" height="68" rx="12"/>
    <rect x="522" y="252" width="4" height="40" rx="2" fill="#e7157b"/>
    <text class="name" x="536" y="267">API Gateway</text>
    <text class="sub" x="536" y="287">HTTP API · rate limits</text>
  </g>

  <!-- Scheduler -->
  <g>
    <rect class="box" x="770" y="128" width="170" height="68" rx="12"/>
    <rect x="782" y="142" width="4" height="40" rx="2" fill="#e7157b"/>
    <text class="name" x="796" y="157">Scheduler</text>
    <text class="sub" x="796" y="177">EventBridge · 06:00</text>
  </g>

  <!-- Lambdas -->
  <g>
    <rect class="box" x="770" y="226" width="200" height="92" rx="12"/>
    <rect x="782" y="240" width="4" height="64" rx="2" fill="#ed7100"/>
    <text class="name" x="796" y="255">8 Lambda functions</text>
    <text class="sub" x="796" y="275">Python 3.12 · arm64</text>
    <text class="sub" x="796" y="295">own IAM role, least privilege</text>
  </g>

  <!-- SES + Comprehend (off) -->
  <g>
    <rect class="off" x="1030" y="128" width="190" height="68" rx="12"/>
    <text class="name" x="1048" y="157">SES · Comprehend</text>
    <text class="sub" x="1048" y="177">emails · review AI check</text>
  </g>

  <!-- DynamoDB -->
  <g>
    <rect class="box" x="1030" y="226" width="190" height="92" rx="12"/>
    <rect x="1042" y="240" width="4" height="64" rx="2" fill="#c925d1"/>
    <text class="name" x="1056" y="255">DynamoDB</text>
    <text class="sub" x="1056" y="275">4 tables, transactions</text>
    <text class="sub" x="1056" y="295">stop double-booking</text>
  </g>

  <!-- Cognito -->
  <g>
    <rect class="box" x="510" y="430" width="200" height="68" rx="12"/>
    <rect x="522" y="444" width="4" height="40" rx="2" fill="#dd344c"/>
    <text class="name" x="536" y="459">Cognito</text>
    <text class="sub" x="536" y="479">admin sign-in, MFA</text>
  </g>

  <!-- CloudWatch -->
  <g>
    <rect class="box" x="770" y="430" width="200" height="68" rx="12"/>
    <rect x="782" y="444" width="4" height="40" rx="2" fill="#e7157b"/>
    <text class="name" x="796" y="459">CloudWatch</text>
    <text class="sub" x="796" y="479">logs · metrics · dashboard</text>
  </g>

  <!-- SNS -->
  <g>
    <rect class="box" x="1030" y="430" width="190" height="68" rx="12"/>
    <rect x="1042" y="444" width="4" height="40" rx="2" fill="#e7157b"/>
    <text class="name" x="1056" y="459">SNS → email</text>
    <text class="sub" x="1056" y="479">2 alarms</text>
  </g>

  <!-- Delivery -->
  <line x1="40" y1="566" x2="1240" y2="566" stroke="#e6d3bd" stroke-width="1.2"/>
  <rect class="bg" x="40" y="556" width="150" height="20"/>
  <text class="tag" x="40" y="571">HOW IT GETS THERE</text>

  <g>
    <rect class="box" x="40" y="600" width="190" height="68" rx="12"/>
    <rect x="52" y="614" width="4" height="40" rx="2" fill="#3b2416"/>
    <text class="name" x="66" y="629">GitHub Actions</text>
    <text class="sub" x="66" y="649">1,148 tests, then deploy</text>
  </g>
  <g>
    <rect class="box" x="510" y="600" width="200" height="68" rx="12"/>
    <rect x="522" y="614" width="4" height="40" rx="2" fill="#dd344c"/>
    <text class="name" x="536" y="629">IAM deploy role</text>
    <text class="sub" x="536" y="649">OIDC, no stored keys</text>
  </g>
  <g>
    <rect class="box" x="770" y="600" width="200" height="68" rx="12"/>
    <rect x="782" y="614" width="4" height="40" rx="2" fill="#9a5a2c"/>
    <text class="name" x="796" y="629">Deploys</text>
    <text class="sub" x="796" y="649">site · Lambda code · cache</text>
  </g>

  <g>
    <rect class="box" x="40" y="704" width="190" height="68" rx="12"/>
    <rect x="52" y="718" width="4" height="40" rx="2" fill="#7b42bc"/>
    <text class="name" x="66" y="733">Terraform</text>
    <text class="sub" x="66" y="753">all 94 resources as code</text>
  </g>
  <g>
    <rect class="box" x="510" y="704" width="200" height="68" rx="12"/>
    <rect x="522" y="718" width="4" height="40" rx="2" fill="#7aa116"/>
    <text class="name" x="536" y="733">S3 state bucket</text>
    <text class="sub" x="536" y="753">versioned · lock file</text>
  </g>

  <!-- Arrows: requests -->
  <path class="line" d="M200 182H250" marker-end="url(#a)"/>
  <path class="line" d="M440 162H510" marker-end="url(#a)"/>
  <text class="lbl" x="452" y="154">pages</text>
  <path class="line" d="M440 272H510" marker-end="url(#a)"/>
  <text class="lbl" x="448" y="264">/api/*</text>
  <path class="line" d="M710 272H770" marker-end="url(#a)"/>
  <path class="line" d="M970 272H1030" marker-end="url(#a)"/>

  <!-- Admin -->
  <path class="line" d="M200 464H510" marker-end="url(#a)"/>
  <text class="lbl" x="300" y="456">sign in (PKCE)</text>
  <path class="line" d="M120 430V350H345V320" marker-end="url(#a)"/>
  <text class="lbl" x="136" y="342">admin page + API, with token</text>
  <path class="line" d="M610 430V306" marker-end="url(#a)"/>
  <text class="lbl" x="620" y="372">token checked</text>
  <text class="lbl" x="620" y="388">on /api/admin/*</text>

  <!-- Scheduler, logs, alarms, off services -->
  <path class="line" d="M855 196V226" marker-end="url(#a)"/>
  <path class="line" d="M870 318V430" marker-end="url(#a)"/>
  <text class="lbl" x="880" y="380">logs + metrics</text>
  <path class="line" d="M970 464H1030" marker-end="url(#a)"/>
  <path class="linem" d="M955 226V212H1125V196" marker-end="url(#am)"/>

  <!-- Delivery arrows -->
  <path class="line" d="M230 634H510" marker-end="url(#a)"/>
  <text class="lbl" x="300" y="626">short-lived credentials</text>
  <path class="line" d="M710 634H770" marker-end="url(#a)"/>
  <path class="line" d="M230 738H510" marker-end="url(#a)"/>
  <text class="lbl" x="300" y="730">plan / apply</text>
</svg>
